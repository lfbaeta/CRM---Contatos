services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Execute npm run setup:local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup:local}
      POSTGRES_DB: ${POSTGRES_DB:?Execute npm run setup:local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - crm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  crm_postgres:
